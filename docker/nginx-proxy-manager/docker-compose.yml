# Reverse proxy. Publish ports come from .env.
services:
  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '${NPM_HTTP_PORT}:80'
      - '${NPM_HTTPS_PORT}:443'
      - '${NPM_ADMIN_PORT}:81'
    volumes:
      - ./nginx-data:/data
      - ./nginx-letsencrypt:/etc/letsencrypt
      - ./nginx-snippets:/snippets:ro
    environment:
      TZ: ${TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
