# Loopback publish. Container port 80. Data dir mode 700.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    restart: unless-stopped
    env_file: ./vaultwarden.env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${VAULTWARDEN_PORT}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/alive"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
